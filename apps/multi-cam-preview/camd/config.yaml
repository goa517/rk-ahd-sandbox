# camd 多路摄像头预览配置
# type: raw（MIPI 直连 RAW 摄像头，经 ISP）/ ahd（XS9922B 虚拟通道，后续阶段）/ stitch（环视拼接，后续阶段）
listen: ":8080"

channels:
  # device 统一用 /dev/v4l/by-path/ 稳定符号链接：启用 CAM0(xs9922b) overlay 后
  # rkcif_mipi_lvds 会注册 11 个 stream 节点，/dev/videoN 编号整体偏移，硬编码编号会失配
  - id: cam1
    name: "CAM1 · GC4653"
    type: raw
    device: /dev/v4l/by-path/platform-rkisp-vir1-video-index0
    enabled: true
    width: 2560
    height: 1440
    fps: 30
    bitrate_kbps: 8192
    gop: 60
    source_fps: 30
    format: NV12

  - id: cam3
    name: "CAM3 · GC4653"
    type: raw
    device: /dev/v4l/by-path/platform-rkisp-vir3-video-index0
    enabled: true
    width: 2560
    height: 1440
    fps: 30
    bitrate_kbps: 8192
    gop: 60
    source_fps: 30
    format: NV12

  # --- CSI2 / CSI4 扩展位：接入摄像头并启用 overlay 后，填 device 并置 enabled: true ---
  - id: csi2
    name: "CSI2 · 预留"
    type: raw
    device: ""
    enabled: false
    width: 1280
    height: 720
    fps: 30
    bitrate_kbps: 2048
    gop: 60

  - id: csi4
    name: "CSI4 · 预留"
    type: raw
    device: ""
    enabled: false
    width: 1280
    height: 720
    fps: 30
    bitrate_kbps: 2048
    gop: 60

  # --- AHD 通道（XS9922B @ CSI0，VC0~VC3）：rkcif 直出 NV12，内置 scaler 缩到 720p ---
  - id: ahd0
    name: "AHD 1"
    type: ahd
    device: /dev/v4l/by-path/platform-rkcif-mipi-lvds-video-index0
    enabled: true
    width: 1920
    height: 1080
    fps: 25
    bitrate_kbps: 5120
    gop: 50
    source_fps: 25
    format: NV12

  - id: ahd1
    name: "AHD 2"
    type: ahd
    device: /dev/v4l/by-path/platform-rkcif-mipi-lvds-video-index1
    enabled: true
    width: 1920
    height: 1080
    fps: 25
    bitrate_kbps: 5120
    gop: 50
    source_fps: 25
    format: NV12

  - id: ahd2
    name: "AHD 3"
    type: ahd
    device: /dev/v4l/by-path/platform-rkcif-mipi-lvds-video-index2
    enabled: true
    width: 1920
    height: 1080
    fps: 25
    bitrate_kbps: 5120
    gop: 50
    source_fps: 25
    format: NV12

  - id: ahd3
    name: "AHD 4"
    type: ahd
    device: /dev/v4l/by-path/platform-rkcif-mipi-lvds-video-index3
    enabled: true
    width: 1920
    height: 1080
    fps: 25
    bitrate_kbps: 5120
    gop: 50
    source_fps: 25
    format: NV12

  # --- 环视拼接（RGA 合成 4 路 AHD → 第 7 路 H.265 流） ---
  # 从 ahd0~3 tap 原始帧（dma-buf 零拷贝），RGA 逐源 裁剪/旋转/缩放 blit 到画布后硬编。
  # layout 与 sources 一一对应：x,y,w,h 为画布目标区域；rotate 顺时针 0/90/180/270；
  # crop 可选 [x,y,w,h] 源图裁剪。手工调整，不做标定。默认 2x2 宫格。
  - id: surround
    name: "360° 环视"
    type: stitch
    device: ""
    enabled: true
    width: 1920
    height: 1080
    fps: 25
    bitrate_kbps: 8192
    gop: 50
    source_fps: 25
    sources: [ahd0, ahd1, ahd2, ahd3]
    layout:
      - { x: 0,   y: 0,   w: 960, h: 540, rotate: 0 }
      - { x: 960, y: 0,   w: 960, h: 540, rotate: 0 }
      - { x: 0,   y: 540, w: 960, h: 540, rotate: 0 }
      - { x: 960, y: 540, w: 960, h: 540, rotate: 0 }
