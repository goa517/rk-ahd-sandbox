<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多路摄像头预览 · RK3576</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="left">
    <span class="app-name">多路摄像头预览</span>
    <span id="conn-dot" class="dot dot-warn"></span>
    <span id="conn-text" class="muted">连接中…</span>
  </div>
  <div class="right">
    <span id="sys-info" class="stat" title="平台 · 处理器 · CPU占用 · 温度 · 内存">--</span>
    <span id="online-count" class="stat">--/-- 在线</span>
    <span id="enc-load" class="stat">编码负载 --%</span>
    <span id="net-rtt" class="stat">RTT --ms</span>
    <span id="latency-med" class="stat">延迟 --ms</span>
  </div>
</header>

<main id="main">
  <div id="grid"></div>

  <aside id="panel" class="collapsed">
    <div class="panel-head">
      <span id="panel-title">参数</span>
      <button id="panel-close" title="收起">×</button>
    </div>
    <div id="panel-body">
      <div id="panel-empty" class="muted">点击选择一个在线通道</div>
      <div id="panel-form" hidden>
        <label>分辨率
          <select id="f-res"></select>
        </label>
        <label>帧率 <span id="f-fps-val" class="muted"></span>
          <input id="f-fps" type="range" min="1" max="30" step="1">
        </label>
        <label>码率 <span id="f-br-val" class="muted"></span>
          <input id="f-br" type="range" min="256" max="8192" step="128">
        </label>
        <label>GOP
          <input id="f-gop" type="number" min="1" max="300" step="1">
        </label>
        <button id="f-apply">应用</button>
        <div class="muted hint">码率/GOP 即时生效；分辨率/帧率变更会短暂重建该路管线</div>
      </div>
      <div id="panel-details" hidden></div>
    </div>
  </aside>
</main>

<footer id="bottombar">
  <span class="muted">布局:</span>
  <button data-preset="grid3">3×3</button>
  <button data-preset="grid2">2×2</button>
  <button data-preset="focus">一大 N 小</button>
  <span class="spacer"></span>
  <button id="btn-panel">参数面板</button>
  <button id="btn-fullscreen">全屏</button>
</footer>

<div id="toast-root"></div>
<script src="app.js"></script>
</body>
</html>
